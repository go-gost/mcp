name: npm-publish

# Manual only: stages packages for maintainer approval. Authentication uses
# GitHub OIDC trusted publishing, so there is no NPM_TOKEN here. Every
# @go-gost/* package needs a trusted publisher for this repository and
# workflow (stage-only). Approval still requires a maintainer's 2FA.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require npm with staged publishing
        run: |
          node -e 'const [a,b]=require("node:child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error("npm >= 11.15.0 is required for npm stage publish"); process.exit(1); }'

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist binaries
          gh release download "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern 'gost-mcp_*' \
            --dir dist

      - name: Unpack binaries into platform directories
        run: |
          set -euo pipefail
          for archive in dist/*; do
            name="$(basename "$archive")"
            name="${name%.tar.gz}"; name="${name%.zip}"
            name="${name#gost-mcp_}"
            version="${name%%_*}"; name="${name#*_}"
            os="${name%%_*}"; arch="${name##*_}"
            case "$os" in windows) os=win32 ;; esac
            case "$arch" in amd64) arch=x64 ;; esac
            target="binaries/${os}-${arch}"
            mkdir -p "$target"
            case "$archive" in
              *.zip) unzip -j -o "$archive" "gost-mcp.exe" -d "$target" ;;
              *) tar -xzf "$archive" -C "$target" gost-mcp ;;
            esac
          done
          find binaries -type f -maxdepth 2 | sort

      - name: Stage packages
        run: node npm/scripts/stage.mjs --version "${{ inputs.version }}" --binaries binaries --out stage

      - name: Stage platform packages
        run: |
          set -euo pipefail
          for dir in stage/mcp-*; do
            (cd "$dir" && npm stage publish --access public)
          done

      - name: Stage main package
        run: cd stage/mcp && npm stage publish --access public
