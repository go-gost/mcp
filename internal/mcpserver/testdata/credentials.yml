# Credentials embedded in node addresses must never reach gost-mcp://egress.
# Both config forms are covered: a chain URI, whose userinfo gost moves into the
# connector auth, and hand-written hops, whose addr keeps the text verbatim.
# Use documentation-only credentials; nothing here is ever dialed.
egress:
  - name: direct
    description: "Host direct, no proxy"
    chain: []

  - name: jp
    description: "Tokyo residential exit with credentials in the chain URI"
    chain:
      - "socks5://alice:hunter2@tokyo.example.com:1080"

  - name: corp
    description: "Corporate hops with credentials in node addresses"
    hops:
      - name: hop-0
        nodes:
          - name: node-0
            addr: "socks5://bob:s3cret@osaka.example.com:1080"
      - name: hop-1
        nodes:
          - name: node-1
            addr: "carol:s3cret@nagoya.example.com:1080"
