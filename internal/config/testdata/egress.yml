# Valid configuration used by the CLI check and later integration tests.
# Deliberately self-contained: no environment references, so it loads with an
# empty environment. env.yml covers expansion.
egress:
  - name: direct
    description: "Host direct, no proxy"
    chain: []

  - name: jp
    description: "Tokyo residential exit (SOCKS5)"
    chain:
      - "socks5://tokyo.example.com:1080"

gost-run:
  timeout: 30s
  max_bytes: 1MiB

gost-trace:
  timeout: 10s
  identity_url: "https://ifconfig.co/json"

gost-wisp:
  relay: "tunnel+wss://wisper.gost.run:443"
  domain: "gost.run"
  max_ttl: 1h
  max_leases: 4
  allow: ["127.0.0.0/8", "::1/128"]

log:
  level: info
